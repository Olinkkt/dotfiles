################################################################################
# 1. MONITORY (Výchozí: Zrcadlení HDMI -> eDP-1)
################################################################################
# Kancelářský hlavní monitor
monitor = HDMI-A-1, preferred, 0x0, 1

# Displej notebooku zrcadlí HDMI-A-1
monitor = eDP-1, preferred, auto, 1, mirror, HDMI-A-1

# DP-1 fallback pro připojení přes DisplayPort
monitor = DP-1, 1920x1080@60, 0x0, 1

# Automatický fallback pro jakýkoliv jiný displej (např. odpojení na cestách)
monitor = , preferred, auto, 1

################################################################################
# 2. AUTOSTART
################################################################################
exec-once = hyprpaper
exec-once = waybar
exec-once = hypridle
exec-once = sleep 2 && nwg-dock-hyprland -d -i 48 -mb 10 -hd 400 -c "wofi --show drun" >/tmp/dock.log 2>&1
exec-once = hyprctl setcursor WhiteSur-cursors 24
exec-once = hyprpm reload -n

env = XCURSOR_THEME,WhiteSur-cursors
env = XCURSOR_SIZE,24

################################################################################
# 3. VSTUP A NASTAVENÍ
################################################################################
input {
    kb_layout = cz,us
    follow_mouse = 1
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(ffffff30)
    col.inactive_border = rgba(ffffff10)
    layout = dwindle
}

decoration {
    rounding = 14

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        vibrancy = 0.2
    }

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    bezier = mac, 0.25, 0.8, 0.25, 1
    animation = windows, 1, 5, mac, popin 90%
    animation = fade, 1, 5, mac
    animation = workspaces, 1, 6, mac, slide
}

plugin {
    hyprbars {
        bar_height = 28
        bar_color = rgba(30303088)
        col.text = rgba(ffffffcc)
        bar_text_font = Inter
        bar_text_size = 11
        bar_text_align = center
        bar_title_enabled = true
        bar_padding = 10
        bar_button_padding = 8
        bar_precedence_over_border = true
        bar_buttons_alignment = left
        icon_on_hover = true

        hyprbars-button = rgb(ff5f57), 13, ✕, hyprctl dispatch killactive
        hyprbars-button = rgb(febc2e), 13, −, hyprctl dispatch movetoworkspacesilent special:minimized
        hyprbars-button = rgb(28c840), 13, +, hyprctl dispatch fullscreen 1
    }
    hyprglass {
        preset = name:mine, inherits:pomme, bevel_strength:0.8, bevel_size:10, fresnel_strength:1.0, specular_strength:0.9
        preset = name:mine:dark, brightness:1.0, adaptive_dim:0.1, tint_color:0xffffff18
        default_preset = mine
        default_theme = dark
        default_preset = mine
	bevel_strength = 0.8
	bevel_size = 10
	fresnel_strength = 1.0
        specular_strength = 0.9
        refraction_strength = 0.8
        dark:brightness = 1.0
        dark:adaptive_dim = 0.1
        tint_color = 0xffffff18	
        
	layers {
            enabled = 1
            namespaces = waybar, nwg-dock, wofi
            preset = subtle
            namespace_mask_thresholds = waybar=0.05
        }
    }
    dynamic-cursors {
        enabled = true
        mode = rotate
        rotate {
            offset = 0.0
            length = 20
        }
        shake {
            enabled = false
        }
    }
}

windowrule = suppress_event maximize, match:class .*

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace waybar
layerrule = blur on, match:namespace wofi
layerrule = ignore_alpha 0.3, match:namespace wofi
layerrule = blur on, match:namespace logout_dialog
layerrule = blur on, match:namespace nwg-dock
layerrule = ignore_alpha 0.3, match:namespace nwg-dock

################################################################################
# 4. TVÉ KLÁVESOVÉ ZKRATKY
################################################################################
$mainMod = SUPER

# Aplikace
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, F, exec, firefox
bind = $mainMod, SPACE, exec, hyprctl switchxkblayout "at-translated-set-2-keyboard" next
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, L, exec, ~/.local/bin/powermenu
bind = $mainMod SHIFT, A, exec, ~/.local/bin/lid-toggle


# Screenshoty
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H-%M-%S').png
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Přepínání a přesun workspaces (české rozložení kláves code:10 až 19)
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

bind = $mainMod_SHIFT, code:10, movetoworkspace, 1
bind = $mainMod_SHIFT, code:11, movetoworkspace, 2
bind = $mainMod_SHIFT, code:12, movetoworkspace, 3
bind = $mainMod_SHIFT, code:13, movetoworkspace, 4
bind = $mainMod_SHIFT, code:14, movetoworkspace, 5
bind = $mainMod_SHIFT, code:15, movetoworkspace, 6
bind = $mainMod_SHIFT, code:16, movetoworkspace, 7
bind = $mainMod_SHIFT, code:17, movetoworkspace, 8
bind = $mainMod_SHIFT, code:18, movetoworkspace, 9
bind = $mainMod_SHIFT, code:19, movetoworkspace, 10

bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, M, togglespecialworkspace, minimized
