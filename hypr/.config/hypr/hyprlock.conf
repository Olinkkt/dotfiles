# ~/.config/hypr/hyprlock.conf
general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 22
    font_family = Inter
    color = rgba(255, 255, 255, 0.9)
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = Inter Bold
    color = rgba(255, 255, 255, 0.95)
    position = 0, 160
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 0
    rounding = 22
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <span foreground="##ffffffaa">Enter Password</span>
    position = 0, -180
    halign = center
    valign = center
}
